```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Ngân Anh 1/6 ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(135deg,#ffd6e7,#fff5f8);
}

/* Tim rơi */
.hearts{
    position:fixed;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
}

.heart{
    position:absolute;
    color:#ff5b93;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}

.page{
    width:100%;
    height:100vh;
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:1s;
}

/* Trang 1 */
.envelope{
    width:240px;
    height:160px;
    background:white;
    border-radius:15px;
    cursor:pointer;
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    animation:float 2s infinite ease-in-out;
}

.envelope::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:120px solid transparent;
    border-right:120px solid transparent;
    border-top:80px solid #ff80ab;
}

.mail{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-30%);
    font-size:50px;
}

.hint{
    margin-top:35px;
    color:#ff4d88;
    font-weight:600;
    font-size:18px;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

/* Trang 2 */
#page2{
    opacity:0;
    pointer-events:none;
}

.letter{
    width:90%;
    max-width:650px;
    background:white;
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.15);
    transform:scale(.2);
    opacity:0;
    transition:1s;
}

.show{
    transform:scale(1);
    opacity:1;
}

.title{
    color:#ff4d88;
    font-size:30px;
    font-weight:700;
    margin-bottom:20px;
}

.photo{
    width:260px;
    max-width:90%;
    border-radius:20px;
    margin:20px 0;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.message{
    font-size:18px;
    color:#555;
    line-height:1.9;
}

.from{
    margin-top:25px;
    color:#ff4d88;
    font-weight:700;
    font-size:20px;
}

.btn{
    margin-top:25px;
    border:none;
    background:#ff4d88;
    color:white;
    padding:12px 28px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<!-- Nhạc nền -->
<audio autoplay loop>
    <source src="nhac.mp3" type="audio/mpeg">
</audio>

<!-- Tim rơi -->
<div class="hearts" id="hearts"></div>

<!-- Trang 1 -->
<div class="page" id="page1">

    <div class="envelope" onclick="openLetter()">
        <div class="mail">💌</div>
    </div>

    <div class="hint">
        Bấm đi có bất ngờ ❤️
    </div>

</div>

<!-- Trang 2 -->
<div class="page" id="page2">

    <div class="letter" id="letter">

        <div class="title">
            💖 Chúc Ngân Anh 1/6 vui vẻ nhóe 💖
        </div>

        <img src="ngananh.png" alt="Ngân Anh" class="photo">

        <div class="message">
            Chúc em luôn cười thật nhiều ❤️<br>
            Luôn vui vẻ, hạnh phúc và gặp thật nhiều điều tốt đẹp.<br><br>

            Mong rằng ngày nào của em cũng tràn ngập niềm vui,
            đáng yêu như chính em vậy ✨
        </div>

        <div class="from">
            From Traideptruongh ❤️
        </div>

        <button class="btn" onclick="loveMessage()">
            💕 Yêu em
        </button>

    </div>

</div>

<script>

function openLetter(){

    document.getElementById("page1").style.opacity="0";

    setTimeout(()=>{

        document.getElementById("page1").style.display="none";

        const page2=document.getElementById("page2");

        page2.style.opacity="1";
        page2.style.pointerEvents="auto";

        setTimeout(()=>{
            document.getElementById("letter").classList.add("show");
        },300);

    },800);
}

function loveMessage(){
    alert("Cảm ơn em đã xuất hiện trong cuộc đời anh ❤️");
}

/* Tim rơi */
const hearts=document.getElementById("hearts");

for(let i=0;i<40;i++){

    let heart=document.createElement("div");

    heart.classList.add("heart");
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.style.animationDuration=(4+Math.random()*6)+"s";

    hearts.appendChild(heart);
}
</script>

</body>
</html>
```
